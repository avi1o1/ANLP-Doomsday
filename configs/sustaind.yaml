schema_version: 1
extends: research.yaml
# SERC workstation: one RTX 2000 Ada (16 GB), Xeon w3-2435 (8 cores, 16 threads),
# 30 GB RAM, one account shared by many people. Every scientific setting comes from
# research.yaml unchanged; this file changes execution only. Run it under
# scripts/courtesy_guard.py so the machine is handed back whenever someone else uses it.
# Three encoding shards per corpus let three encoder workers share the one GPU
# (CSX_TASKS_PER_GPU=3 in the run plan); batches of 8 leave it mostly idle otherwise.
shared_encoding: {shards_per_corpus: 3}
# BM25S threads match this machine's 16 hardware threads instead of the cluster's 36.
bm25: {threads: 16}
# Revisions pinned to the cluster run's frozen configuration
# (research-shared-cluster.yaml), so encodings, datasets and any imported bases
# refer to exactly the same models and data.
