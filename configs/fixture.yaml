schema_version: 1
fixture: true
output_root: results/raw/fixture
encoder: {kind: fixture, dimension: 8, device: cpu, batch_size: 4}
fitting: {documents: 24, max_tokens: 160, validation_fraction: 0.25, scale_documents: 12, seed: 0}
bases:
  - {name: identity, kind: identity}
  - {name: gaussian, kind: random, components: 8}
  - {name: pca, kind: pca, components: 4}
  - {name: kmeans, kind: kmeans, clusters: 4, assignments: 2, backend: sklearn}
  - {name: pq, kind: pq, subspaces: 2, codes: 4, backend: sklearn}
  - {name: rq, kind: rq, stages: 2, codes: 4, backend: sklearn}
  - {name: sae, kind: sae, features: 16, active: 4, epochs: 2, batch_size: 8, micro_batch_size: 4, checkpoint_steps: 1}
granularities: [pooled, token]
budgets: [{name: small, query: 4, document: 8, primary: true}]
shard_size: 7
evaluation_batch_size: 2
dense_search: {backend: cpu, query_batch_size: 2, candidate_buffer: 8, gpu_id: 0}
bm25: {implementation: bm25s, version: 0.3.11, method: lucene, k1: 1.2, b: 0.75, backend: numpy,
       csc_backend: numpy, mmap: false, threads: 1, candidate_buffer: 32}
analysis: {bootstrap_samples: 40, seed: 0}
datasets:
  train: {source: local, path: tests/fixtures/ir, corpus_id: fixture-fit, language: en, split: train, role: fit}
  english: {source: local, path: tests/fixtures/ir, corpus_id: fixture-eval, language: en, split: test, role: evaluate}
